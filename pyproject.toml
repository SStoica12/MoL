[build-system]
requires = ["setuptools>=61,<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mol-vlm"
version = "0.1.0"
description = "Mixture of Layers: Dynamic Layer Routing for Visual Reasoning"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "torch==2.1.2", "torchvision==0.16.2", "numpy==1.26.4",
  "transformers==4.37.2", "tokenizers==0.15.1", "sentencepiece==0.1.99",
  "accelerate==0.21.0", "peft==0.10.0", "safetensors>=0.4.3,<0.8",
  "huggingface-hub==0.36.0", "timm==0.6.13", "einops==0.6.1",
  "einops-exts==0.0.4", "shortuuid", "Pillow>=10,<12", "requests",
  "tqdm", "packaging", "typing-extensions", "matplotlib>=3.7,<3.9",
]

[project.optional-dependencies]
train = ["deepspeed==0.12.6", "ninja", "wandb>=0.16,<0.18"]
eval = ["datasets==2.16.1", "pyarrow==14.0.2", "pandas>=2,<3", "openai>=1,<2"]
quantization = ["bitsandbytes==0.45.5"]

[project.urls]
Paper = "https://arxiv.org/abs/2610.09440"
Homepage = "https://wjdghks950.github.io/mol.github.io/"
Repository = "https://github.com/SStoica12/MoL"
Models = "https://huggingface.co/wjdghks950"

[tool.setuptools.packages.find]
include = ["llava*"]
